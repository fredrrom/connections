[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corpus"
version = "0.1.0"
description = "Corpus selection, sharding and per-problem records for prover runs"
requires-python = ">=3.12,<3.14"
dependencies = ["executor"]

[dependency-groups]
dev = ["pytest"]

[tool.uv.sources]
executor = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["corpus*"]
