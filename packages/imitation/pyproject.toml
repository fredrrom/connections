[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imitation"
version = "0.1.0"
description = "Learned policies for connection tableaux: campaigns, datasets, training"
requires-python = ">=3.12,<3.14"
dependencies = []

[dependency-groups]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["imitation*"]
